# Build and publish the box fleet to GitHub Container Registry (GHCR).
#
# Publish:
#     git tag visionist-v0.1.0
#     git push origin visionist-v0.1.0
#
# ...or trigger manually from Actions with an arbitrary version string
# (e.g. "0.1.0-dev1") without creating a git tag.
#
# Result: ghcr.io/<owner>/<box>:<version> and :latest for every buildable box.
# Image base layers are pinned by digest in the Dockerfiles, so a published
# tag reproduces bit-for-bit no matter when (and where) it is pulled.
#
# Costs: public repo -> GHCR storage is free. Builds run on 2 concurrent
# public runners; a full publish takes ~15-30 min (no shared cache: the
# GHA cache quota is far too small for 8 GB CUDA images).

name: publish boxes

on:
  push:
    tags:
      - "visionist-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish as (e.g. 0.1.0)"
        required: true
        default: "0.0.1"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: "publish ${{ matrix.box.image }}"
    runs-on: ubuntu-latest
    strategy:
      # One failing box must not block the rest from publishing.
      fail-fast: false
      matrix:
        # One entry per publishable box.
        #   dir     = directory under images/ (build context; case-sensitive!)
        #   image   = GHCR image name (lowercase) — this is what `docker pull`
        #             and fleet/docker-compose.yml use.
        #
        # vggt pulls its codebase (facebookresearch/vggt) and the 1B weights
        # (facebook/VGGT-1B, ~5 GB) at build time — the heaviest build in the
        # fleet, but self-contained (nothing missing from the repo anymore).
        box:
          - { dir: clip,          image: clip }
          - { dir: tapnext_tracker, image: tapnext_tracker }
          - { dir: lang_segm,     image: lang_segm }
          - { dir: textEmbedding, image: textembedding }
          - { dir: opencv_box,    image: opencv_box }
          - { dir: yolo,         image: yolo }
          - { dir: vggt,          image: vggt }
          - { dir: moge_box,      image: moge_box }
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ver="$INPUTS_TAG"
          else
            ver="${GITHUB_REF_NAME#visionist-v}"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "publishing tag: $ver"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: "images/${{ matrix.box.dir }}"
          file: "images/${{ matrix.box.dir }}/docker/Dockerfile"
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.box.image }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.box.image }}:latest
          # Build layer cache, kept on the same (free, public) GHCR as a
          # cache image. PER-BOX ref on purpose: the jobs run in parallel and
          # concurrent writers to one shared tag would clobber each other's
          # cache. Identical base/torch layers de-duplicate by digest on the
          # registry, so storage is ~the union, not the sum.
          # mode=min (default): only intermediate layers are cached; the final
          # image is already published under its own tag.
          # First publish pushes the cache once (~5-13 GB per box); after that
          # only changed layers transfer — unchanged boxes build in ~1-2 min.
          # Local dev can feed the same cache: docker login ghcr.io, then
          #   docker buildx build --cache-from type=registry,ref=<this> \
          #   --cache-to type=registry,ref=<this> ...
          cache-from: "type=registry,ref=ghcr.io/${{ github.repository_owner }}/cache-${{ matrix.box.image }}:latest"
          cache-to: "type=registry,ref=ghcr.io/${{ github.repository_owner }}/cache-${{ matrix.box.image }}:latest"

  # Print the immutable digests so the fleet compose can be pinned to them:
  #     docker buildx imagetools inspect ghcr.io/<owner>/<box>:<version>
  report-digests:
    name: "report digests"
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ver="$INPUTS_TAG"
          else
            ver="${GITHUB_REF_NAME#visionist-v}"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: Print digests
        shell: bash
        env:
          VER: ${{ steps.ver.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "Pin fleet/docker-compose.yml to these digests for a fully reproducible fleet:"
          for image in clip tapnext_tracker lang_segm textembedding opencv_box yolo vggt moge_box; do
            d=$(docker buildx imagetools inspect "ghcr.io/${OWNER}/${image}:${VER}" 2>/dev/null \
                | awk '/^Digest:/{print $2}')
            echo "  $image -> ghcr.io/${OWNER}/${image}@${d:-<push failed — check that job>}"
          done
        